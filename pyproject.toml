[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pptxtpl"
version = "0.2.4"
description = "Jinja2 templating for PowerPoint .pptx files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "python-pptx",
    "Jinja2",
    "lxml",
]

[tool.pytest.ini_options]
markers = [
    "slow: opt-in slow tests (set PPTXTPL_FUZZ=1 to run)",
]
